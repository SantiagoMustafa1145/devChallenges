<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>DevChallenge - Business Blog Card</title>
    <meta
      name="description"
      content="Business blog card challenge from DevChallenge."
    />
    <meta name="keywords" content="HTML, CSS, Responsive Design" />
  </head>
  <body>
    <article class="card">
      <header class="card-header">
        <img
          src="./resource/hero-image.jpg"
          alt="Hero Image"
          class="card-image"
        />
        <img
          src="./resource/white-overlay.svg"
          alt="Superposición blanca"
          class="card-overlay"
        />
      </header>
      <section class="card-content">
        <h1 class="card-content-title">Perfect solution for small business</h1>
        <p class="card-content-text">
          Small businesses need to generate leads to grow.
        </p>
        <p class="card-content-text">You can use tools like Ringy</p>
      </section>
      <footer class="card-footer">
        <img
          src="./resource/avatar-image-business-card-1.png"
          alt="Avatar"
          class="card-footer-image"
        />
        <div class="card-footer-content">
          <p class="card-footer-content-title">Amy Burgess</p>
          <p class="card-footer-content-text">Customer Manger, Solution Oy</p>
        </div>
      </footer>
    </article>
  </body>
</html>
